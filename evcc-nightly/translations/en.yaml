configuration:
  name: "Configuration"
  description: >
    Configure the evcc add-on here.
    Typically, you only need to use the default values (config file and database).
    Advanced users may change the paths for custom setups or external integrations. [evcc Home Assistant Addon Manual](https://docs.evcc.io/en/docs/installation/home-assistant)
  config_file:
    name: "Location of evcc.yaml (config_file)"
    description: >
      The location of the evcc.yaml could be /homeassistant/* or /config/* or /data/*. 
      Where /homeassistant/* maps to /config/* and /config/* maps to /addon_configs/<slug>_evcc/* and /data/* maps to /mnt/data/supervisor/addons/data/<slug>_evcc/* in Home Assistant OS. 
      To access /data/* within the evcc container follow https://docs.evcc.io/en/docs/installation/home-assistant.
  sqlite_file:
    name: "Location of evcc.db (sqlite_file)"
    description: >
      The location of the evcc.db could be /homeassistant/* or /config/* or /data/*. 
      Where /homeassistant/* maps to /config/* and /config/* maps to /addon_configs/<slug>_evcc/* and /data/* maps to /mnt/data/supervisor/addons/data/<slug>_evcc/* in Home Assistant OS. 
      To access /data/* within the evcc container follow https://docs.evcc.io/en/docs/installation/home-assistant.
  ssl:
    name: "Enable SSL for Web Interface (ssl)"
    description: >
      Enables HTTPS (SSL/TLS) for the evcc web interface. 
      If set to true, the web UI will be accessed using https:// instead of http://.
      Make sure that evcc or a proxy in front of it supports HTTPS, otherwise enabling this option will cause connection issues.
      Use false for unencrypted HTTP access.
  EVOPT_URI:
    name: "EVopt API Endpoint (EVOPT_URI)"
    description: >
      The endpoint URL for the EVopt API integration. 
      This setting allows evcc to communicate with the EVopt service for advanced optimization, forecasting, and control features.
      Enter the full URL including protocol (e.g., http://localhost:7050).
      Leave empty if not using EVopt features.
      [EVopt Home Assistant Addon](https://github.com/thecem/hassio-evopt)
